<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>高専生向けレジリエンステスト</title>
<style>
 :root { --gap: 16px; }
 body {
   font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
   line-height: 1.6;
   margin: 24px;
 }
 h1 { font-size: 1.4rem; margin-bottom: 8px; }
 .desc { color:#555; margin-bottom: 16px; }
 .q { margin:16px 0; padding:12px; border:1px solid #ccc; border-radius:10px; }
 .q h3 { margin:0 0 10px; font-size:1rem; }
 .scale { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
 .scale label {
   display:flex;
   justify-content:center;
   align-items:center;
   gap:6px;
   border:1px solid #ccc;
   border-radius:8px;
   padding:8px;
   cursor:pointer;
 }
 .actions { margin: 20px 0; display:flex; gap:12px; flex-wrap:wrap; }
 button { padding:10px 16px; border:1px solid #333; border-radius:10px; background:#fff; cursor:pointer; }
 button:hover { background:#f5f5f5; }
 #result { margin-top:24px; padding:16px; border:1px solid #ddd; border-radius:10px; }
 table { border-collapse: collapse; width: 100%; }
 th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; vertical-align: top; }
 .eval { font-weight: 700; text-align: center; font-size: 1.1rem; letter-spacing: .08em; }
 .note { white-space: pre-line; }
 .legend { color:#666; font-size:0.9rem; margin-top: 6px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<h1>高専生向けレジリエンステスト</h1>
<p class="desc">1=当てはまらない〜5=当てはまる を選んでください（全30問）。</p>

<div id="formWrap"></div>

<div class="actions">
  <button id="submitBtn">結果を見る</button>
  <button id="resetBtn">回答をクリア</button>
</div>

<div id="result" hidden>
  <h2>要素ごとのスコア</h2>
  <table id="summaryTable" aria-label="要素別スコア"></table>
  <div class="legend">
    評価ルール：◎（4以上）／◯（平均以上かつ4未満）／△（平均未満）
  </div>

  <h2 style="margin-top:20px;">説明と改善のヒント</h2>
  <p id="comment" class="note"></p>

  <h2 style="margin-top:20px;">レーダーチャート</h2>
  <canvas id="chart" aria-label="5要素レーダーチャート（個人 vs 高専平均）" role="img"></canvas>
</div>

<script>
"use strict";

/* ====== 定義 ====== */
var DOMAINS = ["自尊心","感情調節","自己効力感","楽観性","人間関係"];

// 短い説明（1行目）
var SHORT_DESC = {
  "自尊心":"自分を大切にする力",
  "感情調節":"気持ちを整える力",
  "自己効力感":"自分を信じて行動する力",
  "楽観性":"前向きに考える力",
  "人間関係":"人と支え合う力"
};

// 高専生の平均（比較用）
var BASE = {
  "自尊心":3.30,
  "感情調節":3.18,
  "自己効力感":2.85,
  "楽観性":3.08,
  "人間関係":3.79
};

// アドバイス文（◎/◯/△で出し分け）
// eval: 評価文、action: 改善方法
var ADVICE = {
  "自尊心": {
    "◎": {
      eval: "◎自分自身を大切にできていてよい傾向でしょう。",
      action: "利他的行動（ボランティア活動など）をすることで、自己肯定感が「社会的価値」へと拡張し、社会的自尊心が育めます。"
    },
    "◯": {
      eval: "〇基本安定していますが、状況次第では揺らぎやすいでしょう。",
      action: "リフレーミング（嫌な出来事を別の見方でとらえ直す練習）をすることで、自分軸での自尊心が育ち、さらに安定するでしょう。"
    },
    "△": {
      eval: "△かなり自尊心が低い状態です。",
      action: "「朝早く起きる」「誰かに感謝を伝える」など、小さい目標を設定し、毎日積み重ねていくことで、自尊心が向上します（マイクロゴール法）。"
    }
  },
  "感情調節": {
    "◎": {
      eval: "◎落ち着いて対処できるでしょう。",
      action: "ポジティブな感情は素直に口に出すことで感情の柔軟さが育ちます。"
    },
    "◯": {
      eval: "〇基本落ち着いていますが、ストレスが重なると揺らぎやすいでしょう。",
      action: "感情の波を感じた時にマインドフル呼吸法（3秒吸う→3秒止める→6秒で吐く）をすることで、冷静さが保てます。"
    },
    "△": {
      eval: "△感情に振り回されやすい傾向があります。",
      action: "怒り、不安、悲しみなどをノートにそのまま書くことで、気持ちが落ち着きやすくなります。"
    }
  },
  "自己効力感": {
    "◎": {
      eval: "◎前向きで行動力があり、良い傾向でしょう。",
      action: "「少し不安のある難易度」に挑戦することで、根拠のある自信になります。"
    },
    "◯": {
      eval: "〇基本的に前向きですが、失敗やプレッシャーで揺らぎやすいでしょう。",
      action: "達成したこと、成功したことをノートに記録し、見返すことで、プレッシャーにも強くなるでしょう。"
    },
    "△": {
      eval: "△自分に対して悲観的な傾向があるでしょう。",
      action: "やろうと思ってから5秒以内に動くなど、小さな行動から「できた」感覚を積み重ねていきましょう。"
    }
  },
  "楽観性": {
    "◎": {
      eval: "◎物事を前向きにとらえることができるタイプでしょう。",
      action: "「大丈夫」だけでなく、「どうすればうまくいくか」を考えるようにしましょう。"
    },
    "◯": {
      eval: "〇基本前向きですが、失敗や批判で一気に落ち込む傾向があります。",
      action: "ポジティブな人と話す時間を増やすことで、思考が明るくなるでしょう。"
    },
    "△": {
      eval: "△物事を悲観的にとらえすぎて、未来に希望を持ちにくい傾向があります。",
      action: "「今日良かったこと」を毎日書き出すことで楽観性が向上します。"
    }
  },
  "人間関係": {
    "◎": {
      eval: "◎信頼関係があり、他者との協力も得意なタイプです。",
      action: "相手が困っているときに、一歩先に手を差し伸べるようにすると、質の良い人間関係が築けるでしょう。"
    },
    "◯": {
      eval: "〇話せる人はいるが、本音を言える相手が少ない傾向があります。",
      action: "「ありがとう」を意識して伝えることで、習慣化したつながりが築けるでしょう。"
    },
    "△": {
      eval: "△人と関わるのが苦手な傾向があります。",
      action: "安心できる人1人にだけ定期的に連絡を取り、確実なつながりを築きましょう。"
    }
  }
};

// 設問（逆転は内部で処理、UIには印を出さない）— 全30問
var ITEMS = [
  // 自尊心
  { id:"se1", text:"私は前向きな人間だと思う", domain:"自尊心", reverse:false },
  { id:"se2", text:"私は、自分に大体満足している", domain:"自尊心", reverse:false },
  { id:"se3", text:"私はいくつも長所がある", domain:"自尊心", reverse:false },
  { id:"se4", text:"私は少なくともほかの人と同じ程度には価値ある人間だと思う", domain:"自尊心", reverse:false },
  { id:"se5", text:"私はたいていに人と同じように物事ができる", domain:"自尊心", reverse:false },
  { id:"se6", text:"私には自分に誇りに思えることがほとんどない", domain:"自尊心", reverse:true  },

  // 感情調節
  { id:"er1", text:"私は自分の感情をあまり表に出さない", domain:"感情調節", reverse:false },
  { id:"er2", text:"気持ちが不安定になる出来事があっても，感情がコントロールできなくなることはない", domain:"感情調節", reverse:false },
  { id:"er3", text:"自分の気持ちがはっきりとわかる", domain:"感情調節", reverse:false },
  { id:"er4", text:"自分の感情をコントロールする方法を知っている", domain:"感情調節", reverse:false },
  { id:"er5", text:"気持ちが不安定な状態でも、最後まで作業をやり遂げることはできる方だ", domain:"感情調節", reverse:false },
  { id:"er6", text:"ネガティブな感情を感じているときは、その感情が長く続いてしまう", domain:"感情調節", reverse:true },

  // 自己効力感
  { id:"seff1", text:"自分が立てた計画はうまくできる自信がある", domain:"自己効力感", reverse:false },
  { id:"seff2", text:"あまり人に頼らない方だ", domain:"自己効力感", reverse:false },
  { id:"seff3", text:"何かしようと思ったらすぐに取り掛かることができる", domain:"自己効力感", reverse:false },
  { id:"seff4", text:"思いがけない問題が起こったときでも、うまく処理することができる", domain:"自己効力感", reverse:false },
  { id:"seff5", text:"新しい友達を作るのが得意だ", domain:"自己効力感", reverse:false },
  { id:"seff6", text:"ややこしく見えることには手を出そうとは思わない", domain:"自己効力感", reverse:true  },

  // 楽観性
  { id:"opt1", text:"それほど自信のないことでも結果的になんとかなると思う", domain:"楽観性", reverse:false },
  { id:"opt2", text:"何事もあれこれ思い悩まない", domain:"楽観性", reverse:false },
  { id:"opt3", text:"常に物事のいい面を見ようとする", domain:"楽観性", reverse:false },
  { id:"opt4", text:"私は将来に対して前向きに考えている", domain:"楽観性", reverse:false },
  { id:"opt5", text:"私は何をやってもうまくいく方だと思う", domain:"楽観性", reverse:false },
  { id:"opt6", text:"昔の失敗や、いやだったことについてくよくよと悩んでしまう", domain:"楽観性", reverse:true  },

  // 人間関係
  { id:"rel1", text:"あなたの成果を評価してくれている人がいる", domain:"人間関係", reverse:false },
  { id:"rel2", text:"私は必要なとき頼りにできる人がいる", domain:"人間関係", reverse:false },
  { id:"rel3", text:"わがままを聞いてくれる相手がいる", domain:"人間関係", reverse:false },
  { id:"rel4", text:"私には悩みを話せる相手がいる", domain:"人間関係", reverse:false },
  { id:"rel5", text:"私が失敗をしたときには、助けてくれる人がいる", domain:"人間関係", reverse:false },
  { id:"rel6", text:"自分はだれにも期待されていないと感じることがある", domain:"人間関係", reverse:true  }
];

// 1→5 の順
var SCALE = [
  { value:1, label:"1 当てはまらない" },
  { value:2, label:"2 どちらかといえば当てはまらない" },
  { value:3, label:"3 どちらともいえない" },
  { value:4, label:"4 どちらかといえば当てはまる" },
  { value:5, label:"5 当てはまる" }
];

/* ====== フォーム描画 ====== */
var formWrap = document.getElementById("formWrap");

function renderForm() {
  var idx = 1;
  DOMAINS.forEach(function(domain) {
    ITEMS.filter(function(it){ return it.domain === domain; })
      .forEach(function(it) {
        var wrap = document.createElement("div");
        wrap.className = "q";
        wrap.innerHTML = "<h3>Q" + (idx++) + ". " + it.text + "</h3>";

        var scale = document.createElement("div");
        scale.className = "scale";

        SCALE.forEach(function(s) {
          var lid = it.id + "_" + s.value;
          var label = document.createElement("label");
          var input = document.createElement("input");
          input.type = "radio";
          input.name = it.id;
          input.id = lid;
          input.value = String(s.value);
          input.required = true;

          var span = document.createElement("span");
          span.textContent = s.value;

          label.appendChild(input);
          label.appendChild(span);
          scale.appendChild(label);
        });

        wrap.appendChild(scale);
        formWrap.appendChild(wrap);
      });
  });
}

// DOM構築完了後にフォームを描画
document.addEventListener("DOMContentLoaded", renderForm);

/* ====== 計算ロジック ====== */
function reverseIfNeeded(v, reverse) {
  return reverse ? (6 - v) : v;
}

function collectRaw() {
  var raw = {};
  var missing = [];
  ITEMS.forEach(function(it) {
    var el = document.querySelector("input[name='" + it.id + "']:checked");
    if (!el) {
      missing.push(it.id);
    } else {
      raw[it.id] = parseInt(el.value, 10);
    }
  });
  return { raw: raw, missing: missing };
}

function computeDomainAverages(raw) {
  var sum = {};
  var cnt = {};

  ITEMS.forEach(function(it) {
    var v = raw[it.id];
    if (v == null) return;
    var adj = reverseIfNeeded(v, it.reverse);
    if (!sum[it.domain]) {
      sum[it.domain] = 0;
      cnt[it.domain] = 0;
    }
    sum[it.domain] += adj;
    cnt[it.domain] += 1;
  });

  var avg = {};
  Object.keys(sum).forEach(function(d) {
    avg[d] = sum[d] / cnt[d];
  });
  return avg;
}

/* ====== ◎/◯/△ 判定 ====== */
function iconEval(val, baseline) {
  if (val >= 4.0) return "◎";                 // 4以上
  if (val >= baseline && val < 4.0) return "◯"; // 平均以上かつ4未満
  return "△";                                  // 平均未満
}

/* ====== 表示とコメント ====== */
var chartInstance = null;
var summaryTable = document.getElementById("summaryTable");
var commentEl = document.getElementById("comment");

document.getElementById("submitBtn").addEventListener("click", function() {
  var res = collectRaw();
  var raw = res.raw;
  var missing = res.missing;

  if (missing.length) {
    alert("未回答の項目があります。すべての質問に回答してください。");
    return;
  }

  var averages = computeDomainAverages(raw);

  // テーブル生成
  var html = "<tr><th>要素</th><th>個人平均</th><th>高専平均</th><th>評価</th></tr>";
  DOMAINS.forEach(function(d) {
    var v = averages[d];
    var b = BASE[d];
    var ic = iconEval(v, b);
    html += "<tr>"
          + "<td>" + d + "</td>"
          + "<td>" + v.toFixed(2) + "</td>"
          + "<td>" + b.toFixed(2) + "</td>"
          + "<td class='eval'>" + ic + "</td>"
          + "</tr>";
  });
  summaryTable.innerHTML = html;

  // 説明＋アイコン別アドバイス（3行形式：要素説明＋評価＋改善方法）
  var blocks = DOMAINS.map(function(d) {
    var v = averages[d];
    var b = BASE[d];
    var ic = iconEval(v, b);
    var adv = ADVICE[d][ic];
    return d + "：" + SHORT_DESC[d] + "\n" + adv.eval + "\n→ " + adv.action;
  });
  commentEl.textContent = blocks.join("\n\n");

  // レーダーチャート
  var labels = DOMAINS;
  var userData = labels.map(function(l) { return averages[l] || 0; });
  var baseData = labels.map(function(l) { return BASE[l]; });
  var ctx = document.getElementById("chart");

  if (typeof Chart !== "undefined") {
    if (chartInstance) {
      chartInstance.destroy();
    }
    chartInstance = new Chart(ctx, {
      type: "radar",
      data: {
        labels: labels,
        datasets: [
          {
            label: "あなた",
            data: userData,
            pointRadius: 3,
            borderWidth: 2,
            fill: true
          },
          {
            label: "高専平均",
            data: baseData,
            pointRadius: 3,
            borderWidth: 2,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: true, position: "top" }
        },
        scales: {
          r: {
            suggestedMin: 1,
            suggestedMax: 5,
            ticks: { stepSize: 1, showLabelBackdrop: false }
          }
        },
        elements: { line: { borderWidth: 2 } }
      }
    });
  } else {
    console.warn("Chart.js が読み込めていないため、グラフは表示されません。");
  }

  document.getElementById("result").hidden = false;
});

document.getElementById("resetBtn").addEventListener("click", function() {
  var radios = document.querySelectorAll('input[type="radio"]');
  radios.forEach(function(i) { i.checked = false; });
  document.getElementById("result").hidden = true;
});
</script>
</body>
</html>
